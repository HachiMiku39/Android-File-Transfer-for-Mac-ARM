name: Build arm64 macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install pkg-config
      - name: Build and verify
        run: ./scripts/build.sh
      - name: Package corresponding sources
        run: python3 scripts/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: Android-File-Transfer-Mac-ARM
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Android-File-Transfer-Mac-ARM
          path: dist
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Android File Transfer ARM $GITHUB_REF_NAME" --notes "Native arm64 preview with MTP USB 3 support, ADB Shell and Fastboot. Ad-hoc signed; not notarized. Real-device throughput, flashing and macOS 28 remain unverified. See README for setup and limits." dist/*.zip dist/SHA256SUMS.txt

name: Sync hardware test release notes
on:
  push:
    branches: [main]
    paths:
      - 'docs/benchmarks/2026-10-17/release-notes.txt'
      - '.github/workflows/sync-hardware-test-notes.yml'
permissions:
  contents: write
jobs:
  sync-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the existing preview release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v0.1.0-preview.1 --notes-file 'docs/benchmarks/2026-10-17/release-notes.txt'
